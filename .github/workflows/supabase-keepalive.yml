name: Keep Supabase Alive

on:
  schedule:
    # 3일마다 00:00 UTC (한국시간 09:00)에 실행 — 7일 비활성 정지 방지
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        # psql 직접 연결은 Supabase activity로 집계 안 됨 — REST API ping으로 교체
        # auth/v1/health는 API key 불필요, 프로젝트가 살아있으면 항상 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/auth/v1/health")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "Ping failed with status $STATUS"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      - name: Log Success
        run: echo "Supabase pinged successfully"
